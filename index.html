<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mod Portal</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
    }

    .login-page {
      display: grid;
      min-height: 100vh;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 520px);
      background: var(--bg);
    }

    .login-side {
      position: relative;
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      justify-content: space-between;
      padding: 42px;
      overflow: hidden;
      background: var(--accent);
      color: var(--surface);
    }

    .login-side::before,
    .login-side::after {
      position: absolute;
      border-radius: 50%;
      background: color-mix(in srgb, var(--surface) 8%, transparent);
      content: "";
    }

    .login-side::before {
      width: 420px;
      height: 420px;
      right: -170px;
      bottom: -110px;
    }

    .login-side::after {
      width: 240px;
      height: 240px;
      left: -90px;
      top: 25%;
    }

    .login-brand {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .login-brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 11px;
      background: var(--surface);
      color: var(--accent);
      font-weight: 800;
    }

    .login-brand-text {
      display: flex;
      flex-direction: column;
    }

    .login-brand-text strong {
      font-size: 14px;
      letter-spacing: .08em;
    }

    .login-brand-text span {
      margin-top: 2px;
      opacity: .7;
      font-size: 11px;
    }

    .login-side-center {
      position: relative;
      z-index: 1;
      max-width: 520px;
    }

    .login-side-center h1 {
      margin: 0;
      font-size: clamp(38px, 6vw, 68px);
      line-height: .95;
      letter-spacing: -.055em;
    }

    .login-side-center span {
      display: block;
      margin-bottom: 14px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      opacity: .72;
    }

    .login-side-foot {
      position: relative;
      z-index: 1;
      font-size: 10px;
      opacity: .6;
    }

    .login-main {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 38px;
      background: var(--surface);
    }

    .login-box {
      width: 100%;
      max-width: 360px;
    }

    .login-box-head {
      margin-bottom: 26px;
    }

    .login-box-head span {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .login-box-head h2 {
      margin: 0;
      color: var(--text);
      font-size: 30px;
      line-height: 1;
      letter-spacing: -.04em;
    }

    .login-form {
      display: grid;
      gap: 15px;
    }

    .login-field {
      display: grid;
      gap: 6px;
    }

    .login-field label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }

    .login-field input {
      width: 100%;
      min-height: 44px;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface-2);
      color: var(--text);
    }

    .login-field input:focus {
      border-color: var(--accent);
    }

    .login-submit {
      width: 100%;
      min-height: 44px;
      margin-top: 4px;
      border: 0;
      border-radius: 9px;
      background: var(--accent);
      color: var(--surface);
      font-weight: 700;
    }

    .login-submit:hover {
      background: var(--accent-strong);
    }

    .login-links {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
    }

    .login-links button {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
    }

    .login-links button:hover {
      color: var(--accent);
    }

    @media (max-width: 760px) {
      .login-page {
        grid-template-columns: 1fr;
      }

      .login-side {
        min-height: 250px;
        padding: 28px;
      }

      .login-side-center {
        margin: 45px 0 20px;
      }

      .login-side-center h1 {
        font-size: 42px;
      }

      .login-main {
        min-height: auto;
        padding: 44px 24px;
      }
    }
  </style>
</head>

<body>

<div class="login-page">

  <section class="login-side">

    <div class="login-brand">

      <span class="login-brand-mark">M</span>

      <span class="login-brand-text">
        <strong>MOD PORTAL</strong>
        <span>Staff Portal</span>
      </span>

    </div>

    <div class="login-side-center">
      <span>Private Access</span>
      <h1>Welcome back.</h1>
    </div>

    <div class="login-side-foot">
      Authorized staff only.
    </div>

  </section>

  <main class="login-main">

    <div class="login-box">

      <div class="login-box-head">
        <span>Sign In</span>
        <h2>Mod Portal</h2>
      </div>

      <form class="login-form" action="portal.html">

        <div class="login-field">
          <label for="username">Username</label>
          <input
            id="username"
            type="text"
            autocomplete="username"
            required
          >
        </div>

        <div class="login-field">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button class="login-submit" type="submit">
          Sign In
        </button>

      </form>

      <div class="login-links">

        <button type="button">
          Forgot Password
        </button>

        <button type="button">
          Request Access
        </button>

      </div>

    </div>

  </main>

</div>

</body>
</html>
